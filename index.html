<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Andice的共用畫板・老師端</title><link rel="stylesheet" href="style.css?v=2611251655">
</head><body class="host">
<header class="bar">
  <div class="brand">🖍️ Andice的共用畫板</div>
  <button class="code-pill" id="b-join" title="顯示 QR code 與加入連結">🚪 教室入口 <b id="h-code" hidden>------</b><span id="h-net" class="dot"></span></button>
  <div class="seg" id="mode-seg"><button id="mode-btn" class="on" title="切換模式：上課／簡報／作業（滑鼠移上來就會展開）">模式：上課 ▾</button></div>
  <div class="timer" id="timer" hidden></div>
  <div class="ctx-bar" id="ctx-bar"></div>
  <div class="grow"></div>
  <button class="btn" id="b-task">📋 任務</button>
  <button class="btn" id="b-roster" title="學生名單、分組、移出學生">👥 學生 <b id="h-count">0</b></button>
  <button class="btn" id="b-proj">💾 專案</button>
  <button class="btn help-b" id="b-help" title="如何使用（基本功能介紹／給AI的說明）" aria-label="如何使用">📖</button>
  <button class="btn" id="b-full" title="讓畫板用滿整個螢幕">⛶ 全螢幕</button>
  <button class="btn end" id="b-end" hidden title="結束這堂課：請所有學生離開教室">⏹ 結束</button>
</header>
<main class="host-main">
  <aside class="pages" id="pages"></aside>
  <button class="pages-open" id="pages-open" hidden title="打開頁面欄">▶<small>頁面</small></button>
  <section class="work">
    <div class="board-host" id="board-host"><div class="show-nav" id="show-nav" hidden></div></div>
    <div class="toolbar" id="toolbar"></div>
    <input type="file" id="file-in" accept="image/*" multiple hidden>
    <input type="file" id="pdf-in" accept=".pdf,application/pdf,image/*" multiple hidden>
    <input type="file" id="proj-in" accept=".json,application/json" hidden>
  </section>
  <aside class="side" id="side" hidden></aside>
</main>
<div class="wall task" id="task" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<script src="vendor/mqtt.min.js?v=2611251655"></script><script src="vendor/qrcode.js?v=2611251655"></script>
<script src="net.js?v=2611251655"></script><script src="board.js?v=2611251655"></script><script src="host.js?v=2611251655"></script>
</body></html>
